<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bíblia do Empreendedor</title>
  <meta name="description" content="Bíblia King James com progresso de leitura, mensagens diárias, tarefas cristãs, sabedoria para decisões empreendedoras, mentor com IA e posts diários.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bíblia Emp.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Exo+2:wght@500;600;700;800&family=Patrick+Hand+SC&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="sq-btn" id="menu-btn" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand" data-go="home">
      <div class="brand-tile"><svg viewBox="0 0 24 24" fill="none" stroke="url(#lg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--gold)"/><stop offset="1" style="stop-color:var(--gold)" stop-opacity=".6"/></linearGradient></defs><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M12 6.5v5M9.5 8.5h5"/></svg></div>
      <div class="brand-lines">
        <div class="brand-name">Bíblia do Empreendedor</div>
        <div class="brand-sub" id="brand-sub">Palavra · Propósito · Negócios</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="sq-btn" id="theme-toggle" aria-label="Tema claro/escuro">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
      </button>
      <button class="sq-btn accent" data-go="mentor" aria-label="Mentor IA">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Menu">
    <div class="drawer-head">
      <div class="brand-tile"><svg viewBox="0 0 24 24" fill="none" stroke="url(#lg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--gold)"/><stop offset="1" style="stop-color:var(--gold)" stop-opacity=".6"/></linearGradient></defs><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M12 6.5v5M9.5 8.5h5"/></svg></div>
      <div>
        <div class="drawer-title">Bíblia do <em>Empreendedor</em></div>
        <div class="drawer-sub">King James · Fé e negócios</div>
      </div>
    </div>
    <nav class="drawer-body">
      <div class="drawer-sec">Palavra</div>
      <button class="drawer-item" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Visão Geral</button>
      <button class="drawer-item" data-go="bible"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M12 6.5v5M9.5 8.5h5"/></svg>Bíblia<span class="badge" data-badge="bible" hidden></span></button>
      <button class="drawer-item" data-go="tasks"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Tarefas cristãs<span class="badge" data-badge="tasks" hidden></span></button>
      <div class="drawer-sec">Negócios</div>
      <button class="drawer-item" data-go="business"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>Decisões bíblicas</button>
      <button class="drawer-item" data-go="mentor"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Mentor IA</button>
      <div class="drawer-sec">Conteúdo</div>
      <button class="drawer-item" data-go="create"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>Estúdio de Posts<span class="badge" data-badge="create" hidden></span></button>
      <div class="drawer-sec">Administração</div>
      <button class="drawer-item" data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ajustes</button>
    </nav>
    <div class="drawer-foot"><b>“Entrega as tuas obras ao Senhor.”</b>Provérbios 16:3</div>
  </aside>

  <main id="app">
    <!-- INÍCIO -->
    <section class="view" id="view-home"></section>
    <!-- BÍBLIA -->
    <section class="view" id="view-bible"></section>
    <!-- NEGÓCIOS -->
    <section class="view" id="view-business"></section>
    <!-- CRIAR -->
    <section class="view" id="view-create"></section>
    <!-- MENTOR IA -->
    <section class="view" id="view-mentor"></section>
    <!-- TAREFAS -->
    <section class="view" id="view-tasks"></section>
    <!-- AJUSTES -->
    <section class="view" id="view-settings"></section>
  </main>

  <nav class="tabbar">
    <button data-go="home" class="tab"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
    <button data-go="bible" class="tab"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M12 6.5v5M9.5 8.5h5"/></svg><span>Bíblia</span></button>
    <button data-go="business" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>Negócios</span></button>
    <button data-go="create" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg><span>Posts</span></button>
    <button data-go="mentor" class="tab"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8zM5 15l.6 1.4L7 17l-1.4.6L5 19l-.6-1.4L3 17l1.4-.6z"/></svg><span>Mentor IA</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/creative.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
